[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv

lib_deps =
    https://github.com/FastLED/FastLED.git#3.10.9
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@2.0.17
    https://github.com/tanakamasayuki/ESP32CertBundle.git#03b2e529d089b20627dee63aec14740641f6bd3e

build_flags =
    -include include/build_version.h
