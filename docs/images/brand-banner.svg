<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Teams Presence for ESP32</title>
<desc id="desc">A dark midnight blue branded banner with a glowing ESP32-inspired microchip, colourful status LEDs and the tagline Your Teams status, at a glance.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset=".55" stop-color="#172449"/><stop offset="1" stop-color="#25245A"/></linearGradient>
