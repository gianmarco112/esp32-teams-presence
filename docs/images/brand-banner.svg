 <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font-size:64px;font-weight:800;letter-spacing:-1.8px;fill:#F7F8FF}.tag{font-size:27px;font-weight:500;fill:#C4CBE0}.eyebrow{font-size:17px;font-weight:700;letter-spacing:4px;fill:#A99EFF}.small{font-size:15px;font-weight:600;letter-spacing:2px;fill:#B6C2DD}</style>
</defs>
<rect width="1600" height="520" rx="30" fill="url(#bg)"/>
