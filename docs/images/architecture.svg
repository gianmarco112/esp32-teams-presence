<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Teams Presence ESP32 system architecture</title><desc id="desc">ESP32 connects to Wi-Fi, authenticates with Microsoft Entra ID, polls Microsoft Graph presence, and drives WS2812B LEDs. A browser on the local network configures the device.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c35"/><stop offset="1" stop-color="#182b4b"/></linearGradient><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}.muted{fill:#b7c6dc;font-size:18px}.head{font-size:23px;font-weight:700}.sub{font-size:16px;fill:#d0dced}.box{fill:#21395e;stroke:#6e8db8;stroke-width:2}.cloud{fill:#163e54;stroke:#54b6bf;stroke-width:2}.led{fill:#3b315c;stroke:#a795ed;stroke-width:2}.arrow{stroke:#9fc2ed;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 7}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#9fc2ed"/></marker></defs>
<rect width="1200" height="560" rx="26" fill="url(#bg)"/><text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">SYSTEM ARCHITECTURE</text><text x="600" y="85" text-anchor="middle" class="muted">Standalone Microsoft Teams presence indicator</text>
<rect class="box" x="55" y="185" width="220" height="140" rx="18"/><text x="165" y="225" text-anchor="middle" class="head">Local browser</text><text x="165" y="258" text-anchor="middle" class="sub">Setup &amp; control panel</text><text x="165" y="286" text-anchor="middle" class="sub">Wi-Fi · IDs · LED settings</text>
<rect class="box" x="365" y="160" width="265" height="190" rx="18"/><text x="497" y="205" text-anchor="middle" class="head">ESP32-WROOM-32D</text><text x="497" y="240" text-anchor="middle" class="sub">Wi-Fi provisioning</text><text x="497" y="268" text-anchor="middle" class="sub">OAuth token handling</text><text x="497" y="296" text-anchor="middle" class="sub">Presence polling · FastLED</text><text x="497" y="325" text-anchor="middle" class="sub">NVS configuration</text>
<rect class="cloud" x="760" y="130" width="185" height="115" rx="18"/><text x="852" y="174" text-anchor="middle" class="head">Microsoft</text><text x="852" y="204" text-anchor="middle" class="sub">Entra ID</text><rect class="cloud" x="760" y="285" width="185" height="115" rx="18"/><text x="852" y="330" text-anchor="middle" class="head">Microsoft Graph</text><text x="852" y="360" text-anchor="middle" class="sub">/me/presence</text>
<rect class="led" x="1010" y="205" width="150" height="130" rx="18"/><text x="1085" y="248" text-anchor="middle" class="head">WS2812B</text><text x="1085" y="278" text-anchor="middle" class="sub">RGB LEDs</text><g transform="translate(1037 297)"><circle cx="0" cy="0" r="10" fill="#50d18b"/><circle cx="32" cy="0" r="10" fill="#ef6464"/><circle cx="64" cy="0" r="10" fill="#a88cff"/><circle cx="96" cy="0" r="10" fill="#f2c94c"/></g>
<path class="arrow dash" d="M275 255H365"/><text x="320" y="238" text-anchor="middle" class="sub">HTTP</text><path class="arrow" d="M630 210H760"/><text x="695" y="192" text-anchor="middle" class="sub">Device Code</text><path class="arrow" d="M760 345H630"/><text x="695" y="375" text-anchor="middle" class="sub">Presence JSON</text><path class="arrow" d="M630 290H1010"/><text x="815" y="274" text-anchor="middle" class="sub">GPIO18 · LED data</text>
<rect x="365" y="430" width="580" height="70" rx="14" fill="#172943" stroke="#426184"/><text x="655" y="460" text-anchor="middle" class="sub">Network traffic is initiated by the ESP32</text><text x="655" y="484" text-anchor="middle" class="sub">No Home Assistant, Raspberry Pi, or custom backend required</text></svg>