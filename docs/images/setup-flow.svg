<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Provisioning and Microsoft sign-in flow</title><desc id="desc">Flash firmware, configure Wi-Fi, open the local panel, save tenant and client IDs, complete Microsoft device sign-in, then the ESP32 polls Graph and updates LEDs.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c35"/><stop offset="1" stop-color="#182b4b"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#9fc2ed"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}.box{fill:#21395e;stroke:#6e8db8;stroke-width:2}.accent{fill:#163e54;stroke:#54b6bf;stroke-width:2}.head{font-size:20px;font-weight:700}.sub{font-size:15px;fill:#cfdaea}.arrow{stroke:#9fc2ed;stroke-width:3;fill:none;marker-end:url(#arr)}</style></defs>
<rect width="1200" height="400" rx="24" fill="url(#bg)"/><text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700">FIRST-TIME SETUP</text>
<g><rect class="box" x="35" y="125" width="155" height="130" rx="15"/><text x="112" y="173" text-anchor="middle" class="head">1 · Flash</text><text x="112" y="205" text-anchor="middle" class="sub">Web installer</text><text x="112" y="227" text-anchor="middle" class="sub">or PlatformIO</text>
<rect class="box" x="225" y="125" width="155" height="130" rx="15"/><text x="302" y="173" text-anchor="middle" class="head">2 · Wi-Fi</text><text x="302" y="205" text-anchor="middle" class="sub">Connect to LAN</text><text x="302" y="227" text-anchor="middle" class="sub">or setup AP</text>
<rect class="box" x="415" y="125" width="155" height="130" rx="15"/><text x="492" y="173" text-anchor="middle" class="head">3 · Open page</text><text x="492" y="205" text-anchor="middle" class="sub">Browse to device</text><text x="492" y="227" text-anchor="middle" class="sub">IP address</text>
<rect class="box" x="605" y="125" width="155" height="130" rx="15"/><text x="682" y="173" text-anchor="middle" class="head">4 · Configure</text><text x="682" y="205" text-anchor="middle" class="sub">Tenant ID</text><text x="682" y="227" text-anchor="middle" class="sub">Client ID</text>
<rect class="accent" x="795" y="125" width="155" height="130" rx="15"/><text x="872" y="173" text-anchor="middle" class="head">5 · Sign in</text><text x="872" y="205" text-anchor="middle" class="sub">Device Code</text><text x="872" y="227" text-anchor="middle" class="sub">Microsoft account</text>
<rect class="accent" x="985" y="125" width="180" height="130" rx="15"/><text x="1075" y="173" text-anchor="middle" class="head">6 · Automatic</text><text x="1075" y="205" text-anchor="middle" class="sub">Graph presence</text><text x="1075" y="227" text-anchor="middle" class="sub">LED status</text></g>
<path class="arrow" d="M190 190H225"/><path class="arrow" d="M380 190H415"/><path class="arrow" d="M570 190H605"/><path class="arrow" d="M760 190H795"/><path class="arrow" d="M950 190H985"/>
<text x="600" y="320" text-anchor="middle" class="sub">After initial setup, identifiers and settings persist in ESP32 NVS.</text><text x="600" y="348" text-anchor="middle" class="sub">Presence is refreshed automatically at the configured polling interval.</text></svg>