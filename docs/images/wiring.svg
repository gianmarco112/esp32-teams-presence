<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">ESP32 to WS2812B wiring</title><desc id="desc">GPIO18 connects through a recommended 330 to 470 ohm resistor to DIN. A regulated 5 volt supply powers the strip. ESP32, LED strip, and power supply grounds are connected together. A 1000 microfarad capacitor is recommended across the LED supply.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c35"/><stop offset="1" stop-color="#182b4b"/></linearGradient><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}.title{font-size:28px;font-weight:700}.label{font-size:21px;font-weight:700}.small{font-size:17px;fill:#c3d0e3}.pin{fill:#263f63;stroke:#7896bd;stroke-width:2}.wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.note{fill:#202f4b;stroke:#58759d;stroke-width:1.5}</style></defs>
<rect width="1200" height="660" rx="26" fill="url(#bg)"/><text x="600" y="52" text-anchor="middle" class="title">ESP32 → WS2812B WIRING REFERENCE</text>
<rect x="70" y="115" width="330" height="420" rx="22" fill="#1b3457" stroke="#7896bd" stroke-width="3"/><text x="235" y="160" text-anchor="middle" class="label">ESP32 DevKit</text><rect x="112" y="205" width="245" height="65" rx="10" class="pin"/><text x="234" y="245" text-anchor="middle" class="label">GPIO18 (DATA)</text><rect x="112" y="330" width="245" height="65" rx="10" class="pin"/><text x="234" y="370" text-anchor="middle" class="label">GND</text><text x="235" y="475" text-anchor="middle" class="small">USB used for programming</text>
<rect x="815" y="115" width="310" height="420" rx="22" fill="#27334f" stroke="#a795ed" stroke-width="3"/><text x="970" y="160" text-anchor="middle" class="label">WS2812B strip</text><rect x="860" y="205" width="220" height="65" rx="10" class="pin"/><text x="970" y="245" text-anchor="middle" class="label">DIN</text><rect x="860" y="330" width="220" height="65" rx="10" class="pin"/><text x="970" y="370" text-anchor="middle" class="label">GND</text><rect x="860" y="430" width="220" height="65" rx="10" class="pin"/><text x="970" y="470" text-anchor="middle" class="label">+5 V</text>
<path d="M400 238H520" class="wire" stroke="#e3b85d"/><rect x="520" y="216" width="140" height="44" rx="8" fill="#d4b16a"/><path d="M660 238H815" class="wire" stroke="#e3b85d"/><text x="590" y="198" text-anchor="middle" class="small">330–470 Ω</text><text x="735" y="220" text-anchor="middle" class="small">DATA</text>
<path d="M400 362H815" class="wire" stroke="#aab8c9"/><text x="605" y="345" text-anchor="middle" class="small">COMMON GROUND</text>
<rect x="480" y="430" width="270" height="105" rx="14" fill="#234b46" stroke="#65b7a1" stroke-width="2"/><text x="615" y="468" text-anchor="middle" class="label">Regulated 5 V supply</text><text x="615" y="500" text-anchor="middle" class="small">+5 V OUT  ·  GND OUT</text>
<path d="M750 470H815" class="wire" stroke="#e66e68"/><text x="780" y="450" text-anchor="middle" class="small">+5 V</text><path d="M615 430V362" class="wire" stroke="#aab8c9"/><text x="642" y="416" class="small">GND</text>
<rect x="70" y="570" width="1055" height="58" rx="12" class="note"/><text x="597" y="606" text-anchor="middle" class="small">Recommended: 1,000 µF capacitor across 5 V/GND near the strip · level shifter if required</text></svg>