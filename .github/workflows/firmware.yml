name: Build ESP32 firmware

on:
  push:
    branches:
      - main
      - "release-test/**"
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Create generic firmware configuration
        run: cp include/config.h.example include/config.h

      - name: Determine firmware version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/release-test/* ]]; then
            BUILD_VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's|^release-test/||')"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            BUILD_VERSION="$GITHUB_REF_NAME"
          else
            BUILD_VERSION="dev-$GITHUB_SHA"
          fi
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          printf '#pragma once\n#define FIRMWARE_VERSION "%s"\n' "$BUILD_VERSION" > include/build_version.h
          echo "Building firmware version: $BUILD_VERSION"

      - name: Build ESP32-WROOM-32D firmware
        run: pio run -e esp32dev

      - name: Package firmware binaries
        run: |
          set -euo pipefail
          python scripts/package_firmware.py --version "$BUILD_VERSION" --output dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: teams-presence-build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release-test/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/release-test/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME#release-test/}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          release_flags=()
          release_title="Teams Presence $RELEASE_TAG"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
            release_title="Teams Presence $RELEASE_TAG (test build)"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --generate-notes \
              "${release_flags[@]}"
          fi


  deploy:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release-test/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release-test/')
        uses: actions/configure-pages@v5

      - name: Prepare installer site and stage releases
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release-test/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp -a installer/. _site/

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | select(any(.assets[]; .name == "manifest.json")) | .tag_name' |
          while IFS= read -r tag; do
            if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Skipping release with unsupported tag name: $tag"
              continue
            fi
            target="_site/firmware/$tag"
            mkdir -p "$target"
            echo "Downloading release assets for $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$target"
          done

          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name // empty")
          if [[ -n "$latest_tag" ]]; then
            python3 scripts/generate_ota_manifest.py \
              --version "$latest_tag" \
              --firmware "_site/firmware/$latest_tag/firmware.bin" \
              --base-url "https://gianmarco112.github.io/esp32-teams-presence/firmware/$latest_tag/firmware.bin" \
              --output "_site/latest.json"
          else
            echo "No published release available for OTA yet."
          fi

      - name: Upload GitHub Pages artifact
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release-test/')
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy installer and firmware
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release-test/')
        id: deployment
        uses: actions/deploy-pages@v4
