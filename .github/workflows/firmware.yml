name: Build ESP32 firmware

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Create generic firmware configuration
        run: cp include/config.h.example include/config.h

      - name: Build ESP32-WROOM-32D firmware
        run: pio run -e esp32dev

      - name: Package firmware binaries
        env:
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: python scripts/package_firmware.py --version "$BUILD_VERSION" --output dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: teams-presence-build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          release_title="Teams Presence $GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
            release_title="Teams Presence $GITHUB_REF_NAME (test build)"
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --generate-notes \
              "${release_flags[@]}"
          fi


  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@v5

      - name: Prepare installer site and stage releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp -a installer/. _site/

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | select(any(.assets[]; .name == "manifest.json")) | .tag_name' |
          while IFS= read -r tag; do
            if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Skipping release with unsupported tag name: $tag"
              continue
            fi
            target="_site/firmware/$tag"
            mkdir -p "$target"
            echo "Downloading release assets for $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$target"
          done

      - name: Upload GitHub Pages artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy installer and firmware
        if: startsWith(github.ref, 'refs/tags/v')
        id: deployment
        uses: actions/deploy-pages@v4
