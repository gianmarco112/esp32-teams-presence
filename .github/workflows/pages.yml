name: Deploy firmware installer

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site and stage release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/firmware
          cp -a installer/. _site/

          # Release files are downloaded server-side and served by Pages.
          # This avoids browser CORS restrictions on GitHub release-asset URLs.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == "manifest.json")) | .tag_name' |
          while IFS= read -r tag; do
            if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Skipping release with unsupported tag name: $tag"
              continue
            fi
            target="_site/firmware/$tag"
            mkdir -p "$target"
            echo "Downloading release assets for $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$target"
          done

      - name: Upload installer
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
